name: PSRAM verified update validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profiles:
    name: Exact PSRAM release profiles
    runs-on: ubuntu-latest
    env:
      ESPSOMFY_TOOL_CACHE: ${{ runner.temp }}/espsomfy-lilygo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # manifest verifies the pinned baseline is an ancestor
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.12"
      - name: Install pinned build tooling in user cache
        run: |
          python -m venv "$ESPSOMFY_TOOL_CACHE/pio-python"
          "$ESPSOMFY_TOOL_CACHE/pio-python/bin/python" -m pip install -r tools/lilygo-python-requirements.txt
      - name: Host board profile and GPIO checks
        run: |
          CXX=g++ bash tools/test-board-profile.sh
          CXX=g++ bash tools/test-update-bootloader.sh
          CXX=g++ bash tools/test-update-memory.sh
          CXX=g++ bash tools/test-restore-upload.sh
      - name: Offline manifest rejection tests
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          CXX=g++ bash tools/test-update-assets.sh
      - name: Build and validate every registered PSRAM profile
        run: |
          python -c 'import json; print("\n".join(json.load(open("update-profiles.json"))["profiles"]))' > "$RUNNER_TEMP/update-profiles.txt"
          while IFS= read -r environment; do
            bash tools/build-update.sh "$environment"
          done < "$RUNNER_TEMP/update-profiles.txt"
      - name: Exercise production update worker with offline SDK faults
        env:
          ARDUINOJSON_INCLUDE: .pio/libdeps/lilygo-t-embed-cc1101-plus/ArduinoJson/src
        run: CXX=g++ bash tools/test-update-worker.sh
      - name: Retain reviewable artifacts and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-update-profiles
          path: |
            build/*/artifacts/
            build/*/build.log
            build/*/filesystem.log
          retention-days: 5
