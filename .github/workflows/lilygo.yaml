name: LILYGO full-feature build validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lilygo:
    name: Shared CC1101 and Plus
    runs-on: ubuntu-latest
    env:
      ESPSOMFY_TOOL_CACHE: ${{ runner.temp }}/espsomfy-lilygo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # manifest verifies the pinned baseline is an ancestor
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.12"
      - name: Install pinned build tooling in user cache
        run: |
          python -m venv "$ESPSOMFY_TOOL_CACHE/pio-python"
          "$ESPSOMFY_TOOL_CACHE/pio-python/bin/python" -m pip install -r tools/lilygo-python-requirements.txt
      - name: Host board profile and GPIO checks
        run: CXX=g++ bash tools/test-board-profile.sh
      - name: Offline manifest rejection tests
        run: python tools/test_lilygo_manifest.py
      - name: Offline updater policy and attestation tests
        run: |
          python -m unittest discover -s tools -p 'test_update_*.py'
          CXX=g++ bash tools/test-update-bootloader.sh
          CXX=g++ bash tools/test-update-assets.sh
          CXX=g++ bash tools/test-update-image.sh
          CXX=g++ bash tools/test-update-certificate.sh
          CXX=g++ bash tools/test-update-memory.sh
      - name: Build and validate shared CC1101 and Plus artifacts
        run: bash tools/build-lilygo.sh
      - name: Offline restart and transfer service tests
        env:
          ARDUINOJSON_INCLUDE: .pio/libdeps/lilygo-t-embed-cc1101/ArduinoJson/src
        run: |
          CXX=g++ bash tools/test-safe-restart.sh
          CXX=g++ bash tools/test-application-upload.sh
          CXX=g++ bash tools/test-group-restart.sh
      - name: Offline worker and real SDK link checks
        env:
          ARDUINOJSON_INCLUDE: .pio/libdeps/lilygo-t-embed-cc1101/ArduinoJson/src
        run: |
          CXX=g++ bash tools/test-update-worker.sh
          bash tools/test-update-sdk-link.sh
      - name: Retain reviewable artifacts and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lilygo-t-embed-cc1101
          path: |
            build/lilygo-t-embed-cc1101/artifacts/
            build/lilygo-t-embed-cc1101/build.log
          retention-days: 5
